[project]
name = "cscm"
version = "0.1.0"
description = "channel-crossing optimisation analysis"
authors = [
    {name = "Marc Portier",email = "marc.portier@gmail.com"}
]
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "copernicusmarine (>=2.4.1,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "skyfield (>=1.55,<2.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "shapely (>=2.1.2,<3.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
